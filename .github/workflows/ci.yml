name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install relate
        run: curl -sSfL https://relatedb.ai/install.sh | bash
      - name: Smoke test
        run: sh scripts/smoke-test.sh
